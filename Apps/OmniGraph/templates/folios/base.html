{% extends "base.html" %}

{% block title %}{{ project.name }} — Folios — OmniGraph{% endblock %}

{% block navigation_items %}
<sl-button href="/projects/{{ project.machine_name }}" variant="text">Overview</sl-button>
<sl-button href="/projects/{{ project.machine_name }}/ingestor" variant="text">Ingestor</sl-button>
<sl-button href="/projects/{{ project.machine_name }}/folios" variant="primary">Folios</sl-button>
{% endblock %}

{% block head %}
<link rel="stylesheet" href="/folios-crop.css">
<style>
  .folios-area {
    width: 100%;
    display: grid;
    grid-template-columns: 10rem 18rem 1fr 12rem;
    height: calc(100vh - var(--header-height));
    overflow: hidden;
  }

  .folios-area > div {
    border-right: 1px solid var(--color-border);
    overflow-y: auto;
    min-height: 0;
  }
  .folios-area > div:last-child { border-right: none; }

  .sidebar-lead {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--color-text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 0.6rem 0.75rem 0.4rem;
    border-bottom: 1px solid var(--color-border);
    position: sticky;
    top: 0;
    background: var(--color-surface);
    z-index: 1;
  }

  .folio-page-list {
    list-style: none;
    padding: 0;
    margin: 0;
    font-size: 0.8rem;
  }
  .folio-page-list li {
    padding: 0.3rem 0.75rem;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--color-text-muted);
  }
  .folio-page-list li.named   { color: var(--color-text); }
  .folio-page-list li.selected { background-color: var(--color-bg-selected); color: var(--color-text); }

  .section-list {
    padding: 0.5rem 0.75rem;
    font-size: 0.875rem;
    color: var(--color-text-muted);
  }

  .folios-workarea {
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }
  .folios-selection-bar {
    height: 2rem;
    display: flex;
    align-items: center;
    padding: 0 0.75rem;
    font-size: 0.8rem;
    color: var(--color-text-muted);
    border-bottom: 1px solid var(--color-border);
    flex-shrink: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .folios-thumbs-zoom {
    display: grid;
    grid-template-columns: 1fr 1fr;
    flex: 1;
    min-height: 0;
  }
  .folios-thumbs {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    padding: 0.5rem;
    overflow-y: auto;
    align-content: flex-start;
  }
  .folio-thumb {
    cursor: pointer;
    border: 2px solid transparent;
    border-radius: 2px;
  }
  .folio-thumb.selected {
    border-color: var(--color-accent);
    background-color: var(--color-bg-selected);
  }
  .folio-thumb img { display: block; }
  .folios-zoom { overflow: hidden; padding: 0.5rem; }
  .folios-zoom img { max-width: 100%; height: auto; }

  .folios-tools {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
</style>
{% endblock %}
