{% extends "folios/base.html" %}

{% block title %}{{ project.name }} — Crop — OmniGraph{% endblock %}

{% block head %}{{ super() }}
<style>
  /* Vue app takes over the full viewport — it renders its own navbar. */
  #folios-crop-app {
    position: fixed;
    inset: 0;
    z-index: 100;
  }
</style>
{% endblock %}

{% block content %}
<div id="folios-crop-app"
     data-machine-name="{{ project.machine_name }}"
     data-project-name="{{ project.name }}">
</div>
<script type="module" src="/folios-crop.js"></script>
{% endblock %}
